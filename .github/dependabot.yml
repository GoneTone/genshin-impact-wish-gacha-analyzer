version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 30
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      flutter-html:
        patterns:
          - "flutter_html"
          - "html"
      window-management:
        patterns:
          - "window_manager"
          - "screen_retriever"
    ignore:
      - dependency-name: "flutter_rust_bridge"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 30
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      tracing:
        patterns:
          - "tracing"
          - "tracing-subscriber"
      tls-proxy:
        patterns:
          - "hudsucker"
          - "hyper-rustls"
          - "rcgen"
    ignore:
      - dependency-name: "flutter_rust_bridge"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 30
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
