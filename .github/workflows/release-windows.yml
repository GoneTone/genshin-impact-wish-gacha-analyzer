name: release-windows
run-name: release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z or vX.Y.Z-rc.N)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PASSWORD:   ${{ secrets.WINDOWS_SIGN_PASSWORD }}

    steps:
      # === A. Checkout target branch ================================
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # === B. Toolchain =============================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Verify ISCC on PATH
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { throw "ISCC.exe not on PATH after chocolatey install" }
          Write-Host "ISCC: $($iscc.Source)"

      # === C. Version injection =====================================
      - name: Parse tag & rewrite pubspec
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?)$') {
            throw "tag '$tag' does not match vX.Y.Z[-prerelease]"
          }
          $semver = $Matches[1]
          $buildNumber = ${{ github.run_number }}
          $pubspecVersion = "$semver+$buildNumber"

          $content = Get-Content pubspec.yaml -Raw -Encoding UTF8
          $updated = [regex]::Replace($content, '(?m)^version:\s*\S+', "version: $pubspecVersion", 1)

          if ($updated -eq $content) {
            "VERSION_CHANGED=false" | Out-File $env:GITHUB_ENV -Append
          } else {
            Set-Content pubspec.yaml -Value $updated -Encoding UTF8 -NoNewline
            "VERSION_CHANGED=true" | Out-File $env:GITHUB_ENV -Append
          }
          "PUBSPEC_VERSION=$pubspecVersion" | Out-File $env:GITHUB_ENV -Append
          "SEMVER=$semver" | Out-File $env:GITHUB_ENV -Append

      - name: Commit pubspec bump
        if: env.VERSION_CHANGED == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): bump version to v${{ env.SEMVER }} [skip ci]"
          git push origin HEAD:master

      - name: Capture release commit SHA
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "RELEASE_SHA=$sha" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Release commit SHA: $sha"

      # === D. Build =================================================
      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build_installer\build_release.ps1

      - name: Locate installer
        shell: pwsh
        run: |
          $candidates = @(Get-ChildItem build\installer\*.exe -ErrorAction SilentlyContinue)
          if ($candidates.Count -eq 0) { throw "No *.exe found in build\installer" }
          if ($candidates.Count -gt 1) {
            throw "Multiple *.exe found in build\installer (expected exactly 1):`n$($candidates.FullName -join "`n")"
          }
          $exe = $candidates[0].FullName
          "INSTALLER_PATH=$exe" | Out-File $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($candidates[0].Name)" | Out-File $env:GITHUB_ENV -Append

      # === E. Sign (skip, structure 內嵌於 build_release.ps1) ==========

      # === F. Create or update release draft ========================
      - name: Create or update release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          # inputs.prerelease 是 workflow_dispatch boolean,interpolation 後一律是字串 "true"/"false",故用字串比較
          # --json/--jq 同時偵測 release 是否存在並取得 draft 狀態,順帶把 view 的 stdout 收進變數不污染 log
          $isDraft = gh release view "$tag" --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -ne "true") {
              throw "Release '$tag' already exists and is PUBLISHED; refusing to overwrite its assets."
            }
            Write-Host "Draft '$tag' already exists; refreshing target to $env:RELEASE_SHA and re-uploading installer with --clobber"
            gh release edit "$tag" --target "$env:RELEASE_SHA"
            gh release upload "$tag" "$env:INSTALLER_PATH" --clobber
          } else {
            Write-Host "Creating draft release '$tag' targeting $env:RELEASE_SHA"
            $createArgs = @("$tag", "$env:INSTALLER_PATH", "--draft", "--title", "$tag", "--generate-notes", "--target", "$env:RELEASE_SHA")
            if ("${{ inputs.prerelease }}" -eq "true") { $createArgs += "--prerelease" }
            gh release create @createArgs

            # 在自動產生的 What's Changed 底下附上固定文案(翻譯邀請/防毒說明,維護於 .github/release-footer.md)
            # ConvertFrom-Json 取 body 為單一字串,避免 pwsh 把多行 stdout 切成陣列
            $generated = (gh release view "$tag" --json body | ConvertFrom-Json).body
            $footer = Get-Content .github/release-footer.md -Raw -Encoding UTF8
            $bodyFile = Join-Path $env:RUNNER_TEMP "release_body.md"
            Set-Content -Path $bodyFile -Value "$generated`n`n$footer" -Encoding UTF8 -NoNewline
            gh release edit "$tag" --notes-file $bodyFile
          }

      # === G. Workflow artifact (debug fallback) ====================
      - name: Upload installer as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ env.PUBSPEC_VERSION }}
          path: build/installer/*.exe
          retention-days: 30
          if-no-files-found: warn

      # === H. Step summary ==========================================
      - name: Write step summary
        if: success()
        shell: pwsh
        run: |
          $exe = "${{ env.INSTALLER_PATH }}"
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          $sha  = (Get-FileHash $exe -Algorithm SHA256).Hash
          @"
          ## Release ${{ inputs.tag }}

          - **Pubspec version**: ${{ env.PUBSPEC_VERSION }}
          - **Installer**: ``${{ env.INSTALLER_NAME }}``
          - **Size**: $size MB
          - **SHA-256**: ``$sha``
          - **Release commit**: ``${{ env.RELEASE_SHA }}``
          - **Draft created**: ✓ — review and Publish manually
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
