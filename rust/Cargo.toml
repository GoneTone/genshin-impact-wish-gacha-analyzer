[package]
name = "genshin_capture_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
chrono = "0.4"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
hudsucker = { version = "0.24", default-features = false, features = ["decoder", "rcgen-ca", "rustls-client", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio"] }
rcgen = "0.14"
pem = "3.0.6"
sha1 = "0.10"
hex = "0.4"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Networking_WinInet",
    "Win32_System_Registry",
    "Win32_Foundation",
] }

[lints.rust]
# flutter_rust_bridge 的 #[frb] 巨集會展開出 cfg(frb_expand)，在此宣告以消除 unexpected_cfgs lint。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
